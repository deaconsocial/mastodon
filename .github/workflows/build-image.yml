name: Build images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag (or other git ref) to build, e.g. v4.6.3-deacon.1"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mastodon
            dockerfile: Dockerfile
          - image: mastodon-streaming
            dockerfile: streaming/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          # On tag pushes build the pushed tag; on manual dispatch build the
          # requested ref. Patched release tags already contain the fork's
          # patches and workflow files (the sync workflow puts them there),
          # so the tree is built as-is.
          ref: ${{ inputs.ref || github.ref_name }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/deaconsocial/${{ matrix.image }}:${{ inputs.ref || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
